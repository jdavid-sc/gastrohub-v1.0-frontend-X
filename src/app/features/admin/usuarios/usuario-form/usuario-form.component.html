<div class="page-container">
  <div class="page-header">
    <div class="header-with-back">
      <button class="btn btn-back" (click)="onCancel()">&#8592; Atrás</button>
      <h2>{{ isEdit() ? 'Editar' : 'Crear' }} Usuario</h2>
    </div>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" class="form-layout">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" [(ngModel)]="nombre" name="nombre" required placeholder="Nombre completo" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required placeholder="correo@ejemplo.com" />
      </div>

      @if (!isEdit()) {
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" required placeholder="Mínimo 8 caracteres" />
        </div>
      }

      <div class="form-group">
        <label for="rol">Rol</label>
        <select id="rol" [(ngModel)]="rol" name="rol">
          <option value="ADMIN">Admin</option>
          <option value="MESERO">Mesero</option>
          <option value="COCINA">Cocina</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="activo" name="activo" />
          <span>Activo</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ isEdit() ? 'Guardar cambios' : 'Crear usuario' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
