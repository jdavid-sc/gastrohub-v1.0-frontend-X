<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">🍽️</div>
      <h1>GastroHub</h1>
      <p>Sistema de Gestión de Restaurante</p>
    </div>

    @if (errorMessage()) {
      @if (errorType() === 'inactive') {
        <div class="alert alert-warning">
          <span class="alert-icon">⚠️</span>
          {{ errorMessage() }}
        </div>
      } @else {
        <div class="alert alert-error">{{ errorMessage() }}</div>
      }
    }

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Verificando...
        } @else {
          Iniciar Sesión
        }
      </button>

      <div class="recaptcha-notice">
        <p>
          Protegido por
          <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA" class="recaptcha-logo" />
          reCAPTCHA —
          <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Privacidad</a>
          &amp;
          <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Términos</a>
        </p>
      </div>

      <div class="login-footer">
        <a routerLink="/request-reset">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>
